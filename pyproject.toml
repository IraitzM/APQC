[project]
name = "APQC"
version = "0.2.0"
description = "Based on Accelerated Probabilistic Quantum Clustering"
authors = [
    {name = "Iraitz", email = "iraitzm@gmail.com"},
]
dependencies = [
    "networkx>=3.0",
    "numba>=0.60",
    "numpy>=1.26",
    "tensorflow>=2.18",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
"Homepage" = "https://github.com/IraitzM/APQC"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=8",
]
visualizations = [
    "matplotlib>=3.7.2",
    "seaborn>=0.12.2",
]
notebook = [
    "ipykernel>=6.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
